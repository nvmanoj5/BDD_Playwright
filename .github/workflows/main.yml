
name: Main branch tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Playwright BDD tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ENV: dev

    steps:
      # Step 1: Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Install Chrome and dependencies
      - name: Install Chrome and system dependencies
        run: npx playwright install --with-deps chromium

      # Step 5: Generate BDD tests and execute
      - name: Generate and run BDD tests
        run: npx bddgen && npx playwright test

      # Step 6: Upload Playwright reports
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            playwright-report/
            test-results/
            allure-results/
          if-no-files-found: ignore
          retention-days: 14
